# Keeps the free Supabase project from pausing after 7 quiet days.
# Needs repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL  and  SUPABASE_ANON_KEY
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 1 */3 * *"   # every 3 days, 09:17 Philippine time
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call the ping() function
        env:
          RAW_URL: ${{ secrets.SUPABASE_URL }}
          RAW_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # tidy up common paste mistakes: spaces, quotes, trailing slash
          URL=$(printf '%s' "$RAW_URL" | tr -d '[:space:]"'"'" | sed 's:/*$::')
          KEY=$(printf '%s' "$RAW_KEY" | tr -d '[:space:]"'"'")

          if [ -z "$URL" ]; then echo "::error::Secret SUPABASE_URL is missing or empty. Check its exact name under Settings → Secrets and variables → Actions."; exit 1; fi
          if [ -z "$KEY" ]; then echo "::error::Secret SUPABASE_ANON_KEY is missing or empty."; exit 1; fi
          case "$URL" in
            https://*.supabase.co) ;;
            *) echo "::error::SUPABASE_URL should look like https://yourprojectid.supabase.co (it's ${#URL} characters long and doesn't match that pattern)."; exit 1 ;;
          esac

          code=$(curl -s -o /tmp/out -w "%{http_code}" -X POST "$URL/rest/v1/rpc/ping" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}')
          echo "HTTP $code"; cat /tmp/out; echo
          case "$code" in
            200) echo "Supabase is awake." ;;
            401) echo "::error::Supabase refused the key (401). Re-paste SUPABASE_ANON_KEY."; exit 1 ;;
            404) echo "::error::ping() not found (404). Run schema.sql in Supabase, or check the URL's project ID."; exit 1 ;;
            *)   echo "::error::Unexpected response ($code)."; exit 1 ;;
          esac
